name: ev_app
description: "A Flutter-based mobile companion app for EV owners, providing real-time battery monitoring simulation, nearby charging station discovery, and interactive map visualization."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '^3.7.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7
  
  # Dependency Injection
  get_it: ^8.3.0
  
  # Firebase
  firebase_core: ^4.3.0
  firebase_auth: ^6.1.3
  cloud_firestore: ^6.1.1
  google_sign_in: ^6.3.0
  
  # Functional Programming
  dartz: ^0.10.1
  
  # Maps & Location
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  geolocator: ^14.0.2
  
  # HTTP & API
  http: ^1.6.0
  
  # UI Components
  model_viewer_plus: ^1.9.3
  gradient_progress_bar: ^1.0.7
  dashed_progress_bar: ^0.0.1
  flutter_advanced_switch: ^3.1.0
  font_awesome_icon_class: ^0.0.6
  
  # Configuration & Utilities
  flutter_dotenv: ^5.2.1
  logger: ^2.6.2
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  
  # Linting
  flutter_lints: ^5.0.0
  
  # Testing
  mockito: ^5.5.0
  build_runner: ^2.7.1
  bloc_test: ^10.0.0

flutter:
  uses-material-design: true
  
  assets:
    - .env
    - assets/icons/
    - assets/images/
